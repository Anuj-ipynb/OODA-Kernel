[project]
name = "ooda-kernel"
version = "0.1.0"
description = "Autonomous Incident Remediation Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.30.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.5.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0"
]
